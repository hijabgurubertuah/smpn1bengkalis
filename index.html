    <meta property="og:image:alt" content="Logo Sekolah" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PortalResmi" />
    <link id="dynamic-favicon" rel="icon" type="image/x-icon" href="/favicon.ico?v=4" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=4" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=4" />
    <link id="dynamic-apple-icon" rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4" />
    <script>
      // Instantly apply user-uploaded school favicon from local storage before render
      (function() {
        try {
          var raw = localStorage.getItem('smpn1_public_config_v4') || localStorage.getItem('public_school_config') || localStorage.getItem('admin_school_config') || localStorage.getItem('school_config');
          if (raw) {
            var parsed = JSON.parse(raw);
            var icon = (parsed && parsed.identity && (parsed.identity.faviconUrl || parsed.identity.logoUrl)) || '';
            if (icon && typeof icon === 'string' && icon.trim() && !icon.includes('photo-1546410531') && !icon.includes('photo-1594608661623')) {
              var fav = document.getElementById('dynamic-favicon');
              if (fav) fav.href = icon.trim();
              var apple = document.getElementById('dynamic-apple-icon');
              if (apple) apple.href = icon.trim();
            }
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script>
      // Suppress benign [vite] websocket connection logs in sandboxed preview iframe
      (function() {
        const origError = console.error;
        console.error = function(...args) {
          if (args.length > 0 && typeof args[0] === 'string' && args[0].includes('[vite]')) {
            console.debug(...args);
            return;
          }
          origError.apply(console, args);
        };
      })();
    </script>
  </head>
  <body class="font-sans antialiased bg-slate-900 text-slate-900 selection:bg-blue-600 selection:text-white min-h-screen">
    <div id="root">
      <!-- Anti-white-screen initial static skeleton before React mounts -->
      <div style="background-color: #0f172a; color: #ffffff; min-height: 100vh; font-family: system-ui, -apple-system, sans-serif;">
        <div style="background-color: #1e293b; padding: 12px 16px; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <div style="width: 36px; height: 36px; border-radius: 50%; background-color: #334155;"></div>
            <div>
              <div style="width: 140px; height: 14px; background-color: #334155; border-radius: 4px; margin-bottom: 4px;"></div>
              <div style="width: 90px; height: 10px; background-color: #334155; border-radius: 4px;"></div>
            </div>
          </div>
          <div style="width: 100px; height: 28px; background-color: #334155; border-radius: 6px;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
